<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2a6f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%230b2a6f%22/%3E%3Ctext x=%2232%22 y=%2241%22 font-family=%22Arial%22 font-weight=%22700%22 font-size=%2224%22 fill=%22white%22 text-anchor=%22middle%22%3EES%3C/text%3E%3C/svg%3E">
  <title>Messagerie d'équipe · ESGA</title>
  <meta name="description" content="ES Genas Azieu : messagerie d'équipe, groupes, sondages, absences et convocations">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../commun/charte.css?v=2026-11-21a">
  <link rel="stylesheet" href="style.css?v=2026-11-21a">
  <script src="../commun/modules.js?v=2026-11-21a" data-module="messagerie" defer></script>
</head>
<body class="chargement" data-espace="discussions">
  <div class="demo-bandeau">
    <span class="b-mode" id="bandeauMode"><b>Démo</b></span>
    <span class="b-qui">Vous : <b id="bandeauQui"></b> · <a class="lien" href="../#bienvenue">Changer de profil</a></span>
    <label id="lblEquipe" hidden>Équipe <select id="choixEquipe"></select></label>
    <label id="lblProfil" hidden>Voir comme <select id="choixProfil"></select></label>
    <button class="lien" id="btnReinitialiser" hidden>Remettre à zéro</button>
  </div>

  <div class="appli">
    <nav class="espaces" aria-label="Espaces">
      <button class="espace-btn" data-espace="discussions">Discussions <span class="badge" id="badgeTotal" hidden></span></button>
      <button class="espace-btn" data-espace="coach" id="ongletCoach" hidden>Espace coach</button>
    </nav>

    <!-- Discussions -->
    <div class="discussions">
      <aside class="panneau">
        <div class="liste-tete">
          <b>Discussions</b>
          <span class="outils">
            <button class="mini-btn clair" id="btnPerso" title="Écrire à une personne">Nouvelle</button>
            <button class="mini-btn clair" id="btnGroupe" title="Créer un groupe">Groupe</button>
          </span>
        </div>
        <input id="recherche" type="search" placeholder="Rechercher une conversation" aria-label="Rechercher">
        <div id="semaine" class="semaine"></div>
        <div id="listeConvs" class="convs"></div>
      </aside>

      <section class="chat-zone">
        <div id="chatVide" class="chat-vide">Choisissez une conversation.</div>
        <div id="chat" class="chat" hidden>
          <header id="chatTete" class="chat-tete"></header>
          <button id="epingle" class="epingle" hidden></button>
          <div id="fil" class="fil" aria-live="polite"></div>
          <button id="versBas" class="vers-bas" hidden aria-label="Aller aux derniers messages"></button>
          <div id="menuPlus" class="menu-plus" hidden></div>
          <div id="ctx" class="ctx" hidden></div>
          <div id="reponseBarre" class="reponse-barre" hidden></div>
          <div id="lectureSeule" class="lecture-seule" hidden>Seuls les coachs et les dirigeants écrivent ici. Pour discuter entre vous (covoiturage…), utilisez le Blabla de l’équipe.</div>
          <form id="formEnvoi" class="envoi">
            <button type="button" class="rond-btn plus" id="btnPlus" aria-label="Sondage, absence…"></button>
            <div class="saisie-boite">
              <textarea id="saisie" rows="1" placeholder="Message" aria-label="Message"></textarea>
              <button type="button" class="icone photo-btn" id="btnPhoto" aria-label="Envoyer une photo"></button>
              <input type="file" id="fichierPhoto" accept="image/*" hidden>
            </div>
            <button class="rond-btn envoyer" id="btnEnvoyer" aria-label="Envoyer"></button>
          </form>
        </div>
      </section>
    </div>

    <!-- Espace coach -->
    <div class="coach-zone">
      <nav class="c-onglets" aria-label="Espace coach">
        <button class="c-onglet" data-coach="match">Sondage du match</button>
        <button class="c-onglet" data-coach="convoc">Compo et convocation</button>
        <button class="c-onglet" data-coach="entrainements">Entraînements et absences</button>
      </nav>
      <div id="coachContenu" class="coach-contenu"></div>
    </div>
  </div>

  <div id="modale" class="modale" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="../commun/club.js?v=2026-11-21a"></script>
  <script src="stockage.js?v=2026-11-20b"></script>
  <script src="app.js?v=2026-11-21a"></script>
</body>
</html>
