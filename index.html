<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2a6f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%230b2a6f%22/%3E%3Ctext x=%2232%22 y=%2241%22 font-family=%22Arial%22 font-weight=%22700%22 font-size=%2224%22 fill=%22white%22 text-anchor=%22middle%22%3EES%3C/text%3E%3C/svg%3E">
  <title>ESGA · Console du club</title>
  <script>
    // Anciens liens de la veille des PV (#semaine, #historique, #equipe/U17…) : renvoyés vers le module PV.
    (function () {
      const h = decodeURIComponent(location.hash.slice(1)), [page, id] = h.split("?")[0].split("/");
      const console_ = ["accueil", "bienvenue", "moi", "feuille", "calendrier", "equipes", "equipe", "licencies", "staff", "convocations", "convoc", "parametres"];
      if (h && (!console_.includes(page) || (page === "equipe" && id && !/-\d+$/.test(id)))) location.replace("pv.html" + location.hash);
    })();
  </script>
  <meta name="description" content="ES Genas Azieu : console du club, licenciés, éducateurs, équipes, calendrier, convocations et présences, au même endroit">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="commun/charte.css?v=2026-11-22s">
  <link rel="stylesheet" href="console/style.css?v=2026-11-23c">
  <script src="commun/modules.js?v=2026-11-22s" data-module="console" defer></script>
  <script src="commun/club.js?v=2026-11-23c"></script>
</head>
<body class="chargement">
  <div class="demo-bandeau">
    <span><b id="modeClub">Démo</b> · Vous êtes <b id="quiSuisJe"></b></span>
    <a class="changer-profil" href="#bienvenue">Changer de profil</a>
  </div>
  <div class="console">
    <nav class="menu" id="menu" aria-label="Sections"></nav>
    <main class="contenu" id="contenu" tabindex="-1"></main>
  </div>

  <div class="tiroir-fond" id="tiroirFond" hidden></div>
  <aside class="tiroir" id="tiroir" role="dialog" aria-modal="true" aria-labelledby="tiroirTitre" hidden>
    <header class="tiroir-tete"><h2 id="tiroirTitre"></h2><button class="icone" data-a="fermer" aria-label="Fermer">✕</button></header>
    <div class="tiroir-corps" id="tiroirCorps"></div>
  </aside>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="console/app.js?v=2026-11-23c"></script>
</body>
</html>
