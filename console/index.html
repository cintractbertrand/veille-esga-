<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2a6f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%230b2a6f%22/%3E%3Ctext x=%2232%22 y=%2241%22 font-family=%22Arial%22 font-weight=%22700%22 font-size=%2224%22 fill=%22white%22 text-anchor=%22middle%22%3EES%3C/text%3E%3C/svg%3E">
  <title>Console du club · ESGA</title>
  <meta name="description" content="ES Genas Azieu : licenciés, éducateurs, équipes, calendrier, convocations et présences, au même endroit">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../commun/charte.css?v=2026-11-20e">
  <link rel="stylesheet" href="style.css?v=2026-11-20e">
  <script src="../commun/modules.js?v=2026-11-20e" data-module="console" defer></script>
  <script src="../commun/club.js?v=2026-11-20e"></script>
</head>
<body class="chargement">
  <div class="demo-bandeau">
    <span><b>Démo</b> · les données restent dans ce navigateur et sont partagées avec la messagerie, le Monteur et les PV. Changez de profil pour voir la console d'un coach.</span>
    <label>Je suis <select id="choixProfil" aria-label="Profil"></select></label>
  </div>
  <div class="console">
    <nav class="menu" id="menu" aria-label="Sections"></nav>
    <main class="contenu" id="contenu" tabindex="-1"></main>
  </div>

  <div class="tiroir-fond" id="tiroirFond" hidden></div>
  <aside class="tiroir" id="tiroir" role="dialog" aria-modal="true" aria-labelledby="tiroirTitre" hidden>
    <header class="tiroir-tete"><h2 id="tiroirTitre"></h2><button class="icone" data-a="fermer" aria-label="Fermer">✕</button></header>
    <div class="tiroir-corps" id="tiroirCorps"></div>
  </aside>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="app.js?v=2026-11-20e"></script>
</body>
</html>
