name: Essai navigateur FFF (temporaire)
on:
  push:
    branches: [claude/project-thread-6c3uj4]
    paths: [.github/workflows/sonde-fff.yml]
jobs:
  essai:
    runs-on: ubuntu-latest
    steps:
      - run: npm i playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: |
          cat > essai.mjs <<'JS'
          import { chromium } from "playwright";
          const b = await chromium.launch();
          const p = await b.newPage();
          for (const u of ["https://epreuves.fff.fr/competition/club/523341-genas-azieu-e-s/equipe/2026_8789_U13_19/saison",
                           "https://epreuves.fff.fr/competition/club/523341-genas-azieu-e-s/equipe/2026_8789_SEM_1/saison"]) {
            const r = await p.goto(u, { waitUntil: "networkidle", timeout: 60000 }).catch((e) => ({ status: () => "erreur " + e.message }));
            const n = await p.locator("app-match-score").count().catch(() => -1);
            console.log(u, "HTTP", r.status(), "titre:", await p.title(), "matchs:", n);
            console.log((await p.locator("body").innerText().catch(() => "")).slice(0, 400));
          }
          await b.close();
          JS
          node essai.mjs
