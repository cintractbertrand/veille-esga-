name: Télécharger les PV du District

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URL de PDF supplémentaires (séparées par des espaces)"
        required: false
        default: ""
  schedule:
    # Jeudi 18h et 19h UTC (19h-20h à Paris en hiver)
    - cron: "17 18 * * 4"
    - cron: "17 19 * * 4"

permissions:
  contents: write

jobs:
  telecharger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: python3 scripts/telecharger_pv.py ${{ github.event.inputs.urls }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add pv-texte
          git diff --cached --quiet || (git commit -m "Textes des PV du District" && git push)
