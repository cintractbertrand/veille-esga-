name: Mise à jour du calendrier
on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: write

jobs:
  calendrier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer les équipes Scorenco
        run: |
          set -e
          mkdir -p data
          curl -sf -X POST "https://graphql.scorenco.com/v1/graphql" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ teams_team(where:{club_id:{_eq:128233}}) { id name slug season_id competition { id name slug } } }"}' \
            -o /tmp/teams.json
          cat /tmp/teams.json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          teams = d.get('data',{}).get('teams_team',[])
          print(f'{len(teams)} équipes trouvées')
          for t in teams:
              comp = t.get('competition') or {}
              print(f'  {t[\"id\"]:>8}  {t[\"slug\"]:20}  {comp.get(\"name\",\"?\")}')
          "

      - name: Introspection du type teams_team
        run: |
          curl -sf -X POST "https://graphql.scorenco.com/v1/graphql" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ __type(name:\"teams_team\") { fields { name type { name kind ofType { name kind } } } } }"}' | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          fields = d.get('data',{}).get('__type',{}).get('fields',[])
          for f in sorted(fields, key=lambda x:x['name']):
              t = f['type']
              tname = t.get('name') or (t.get('ofType',{}) or {}).get('name','?')
              print(f'  {f[\"name\"]:30} {t[\"kind\"]:10} {tname}')
          "

      - name: Tables de matchs et classements
        run: |
          curl -sf -X POST "https://graphql.scorenco.com/v1/graphql" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ __schema { queryType { fields { name } } } }"}' | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          fields = d.get('data',{}).get('__schema',{}).get('queryType',{}).get('fields',[])
          for f in sorted(fields, key=lambda x:x['name']):
              n = f['name']
              if any(k in n.lower() for k in ['match','event','game','fixture','result','standing','rank','calendar','score']):
                  print(f'  {n}')
          "

      - name: Test matchs d une équipe
        run: |
          TID=$(cat /tmp/teams.json | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          teams=d.get('data',{}).get('teams_team',[])
          if teams: print(teams[0]['id'])
          ")
          echo "Team ID: $TID"
          curl -sf -X POST "https://graphql.scorenco.com/v1/graphql" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"{ teams_team_by_pk(id: $TID) { id name slug matches(order_by:{date:asc}) { id date time home_team_name away_team_name home_score away_score status matchday venue { name } } } }\"}" | python3 -m json.tool | head -80

      - name: Test events d une équipe
        run: |
          TID=$(cat /tmp/teams.json | python3 -c "
          import json,sys; d=json.load(sys.stdin); print(d['data']['teams_team'][0]['id'])
          ")
          curl -sf -X POST "https://graphql.scorenco.com/v1/graphql" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"{ teams_team_by_pk(id: $TID) { id name slug events(order_by:{date:asc}) { id date time home_team_name away_team_name home_score away_score status matchday } } }\"}" | python3 -m json.tool | head -80
