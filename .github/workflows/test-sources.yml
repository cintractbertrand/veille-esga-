name: Mise à jour du calendrier
on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: write

concurrency:
  group: calendrier
  cancel-in-progress: false

jobs:
  calendrier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire Scorenco (matchs, résultats, poules)
        run: python3 outils/scorenco.py data/calendrier-scorenco.json

      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendrier-scorenco.json
          if git diff --cached --quiet; then
            echo "Pas de changement"
          else
            git commit -m "Mise à jour automatique du calendrier Scorenco"
            git push
          fi
