name: Mise à jour du calendrier
on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: write

jobs:
  calendrier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Équipes ESGA
        run: |
          set -e
          mkdir -p data
          curl -s -X POST "https://graphql.scorenco.com/v1/graphql" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ teams_team(where:{club_id:{_eq:128233}}) { id name slug gender age_category rank number } }"}' \
            -o /tmp/teams.json
          python3 -c "
          import json
          d = json.load(open('/tmp/teams.json'))
          teams = d.get('data',{}).get('teams_team',[])
          print(f'{len(teams)} équipes')
          for t in teams:
              print(f'  {t[\"id\"]:>8}  {t[\"slug\"]:25}  {t.get(\"age_category\",\"\")}  rang={t.get(\"rank\",\"?\")}')
          with open('/tmp/team_ids.txt','w') as f:
              for t in teams: f.write(str(t['id']) + '\n')
          "

      - name: Introspection args event_detail_by_club_id
        run: |
          curl -s -X POST "https://graphql.scorenco.com/v1/graphql" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ __type(name:\"competitions_event_detail_by_club_id_args\") { inputFields { name type { name kind ofType { name } } } } }"}' \
            | python3 -m json.tool

      - name: Test event avec champs jsonb teams
        run: |
          TID=$(head -1 /tmp/team_ids.txt)
          echo "Team $TID"
          curl -s -X POST "https://graphql.scorenco.com/v1/graphql" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"{ teams_team_by_pk(id: $TID) { id name last_events { id date time status teams url level_name } } }\"}" \
            | python3 -m json.tool | head -60

      - name: Test next_events
        run: |
          TID=$(head -1 /tmp/team_ids.txt)
          curl -s -X POST "https://graphql.scorenco.com/v1/graphql" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"{ teams_team_by_pk(id: $TID) { id name next_events { id date time status teams url level_name } } }\"}" \
            | python3 -m json.tool | head -60

      - name: Classement détaillé
        run: |
          TID=$(head -1 /tmp/team_ids.txt)
          echo "Team $TID"
          curl -s -X POST "https://graphql.scorenco.com/v1/graphql" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"{ competitions_ranking_detail(where:{team_id:{_eq:$TID}}) { id team_id rank pts played win lost even gf ga gd name_in_competition team_slug club_slug } }\"}" \
            | python3 -m json.tool

      - name: Classement complet de la poule
        run: |
          # Chercher le level_in_season_id de la première équipe pour avoir toute la poule
          TID=$(head -1 /tmp/team_ids.txt)
          # D abord trouver le level_in_season_id via un event
          curl -s -X POST "https://graphql.scorenco.com/v1/graphql" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"{ teams_team_by_pk(id: $TID) { last_events { level_in_season_id } } }\"}" \
            -o /tmp/level.json
          LEVEL=$(python3 -c "
          import json
          d=json.load(open('/tmp/level.json'))
          evs=d.get('data',{}).get('teams_team_by_pk',{}).get('last_events',[])
          if evs: print(evs[0].get('level_in_season_id',''))
          " 2>/dev/null)
          echo "Level in season: $LEVEL"
          if [ -n "$LEVEL" ]; then
            curl -s -X POST "https://graphql.scorenco.com/v1/graphql" \
              -H "Content-Type: application/json" \
              -d "{\"query\":\"{ competitions_ranking_detail(where:{team_in_season:{level_in_season_id:{_eq:$LEVEL}}}, order_by:{rank:asc}) { rank pts played win even lost gf ga gd name_in_competition team_slug club_slug } }\"}" \
              | python3 -m json.tool | head -80
          fi

      - name: Calendrier de la poule (adversaires)
        run: |
          TID=$(head -1 /tmp/team_ids.txt)
          LEVEL=$(python3 -c "
          import json
          d=json.load(open('/tmp/level.json'))
          evs=d.get('data',{}).get('teams_team_by_pk',{}).get('last_events',[])
          if evs: print(evs[0].get('level_in_season_id',''))
          " 2>/dev/null)
          echo "Level $LEVEL : tous les matchs de la poule"
          if [ -n "$LEVEL" ]; then
            curl -s -X POST "https://graphql.scorenco.com/v1/graphql" \
              -H "Content-Type: application/json" \
              -d "{\"query\":\"{ competitions_event_detail(where:{level_in_season_id:{_eq:$LEVEL}}, order_by:{date:asc}, limit:10) { id date time status teams url } }\"}" \
              | python3 -m json.tool | head -80
          fi
